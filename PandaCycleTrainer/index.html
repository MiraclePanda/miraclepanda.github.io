<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<!-- 読み込んでよい先を絞る(レビュー Q15)。スクリプト・データは同じサイトだけ。外へ出る通信は
     「最高」の実在の地形(国土地理院のタイル)だけ。React の style 属性のため style は inline を許す。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cyberjapandata.gsi.go.jp; connect-src 'self' https://cyberjapandata.gsi.go.jp; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />
<title>PandaCycleTrainer</title>
<meta name="description" content="CYCPLUS DC1対応 BLE FTMS仮想サイクリングWebアプリ" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="root">
  <p style="padding:2rem;font-family:sans-serif;">読み込み中...</p>
</div>

<!-- React / ReactDOM (UMD。リポジトリに同梱した vendor/ から読む。ビルドツール不使用) -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<!-- Three.js も同梱の vendor/three/ を相対 URL で import する(js/three/three.js 参照)。
     importmapは使わない — 一部の管理・サンドボックス環境ではimport mapの
     解決がポリシーでブロックされる場合があるため、より互換性の高い
     素の相対URL importを採用している。 -->

<!-- アプリ本体 (ESモジュール, JSXなし = React.createElementで記述) -->
<script type="module" src="js/main.js"></script>
</body>
</html>
